<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X 单向关注筛选器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <div class="kicker">X / FOLLOW AUDIT</div>
      <h1>单向关注<br /><em>筛选器</em></h1>
      <p class="lede">找出你关注了、但没有回关你的账号。</p>
      <button id="start" class="primary" type="button">
        <span>开始扫描</span><span aria-hidden="true">↗</span>
      </button>
      <button id="show" class="secondary" type="button">打开结果面板</button>
      <a id="creator-follow" class="creator-follow" href="https://x.com/intent/follow?screen_name=eshiyiblog" target="_blank" rel="noreferrer">觉得好用 浇个朋友 <span>↗</span></a>
      <p id="status" class="status" role="status"></p>
      <div class="note"><span class="dot"></span>搜索中隐藏面板不会停止任务；下次点击浏览器工具栏图标，再点“打开结果面板”即可恢复。</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
